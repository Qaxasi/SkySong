# Spring Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/skysong
spring.datasource.username=User
spring.datasource.password=${MYSQL_PASSWORD}

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Spring Main
spring.main.banner-mode=off

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security - JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=600000
application.security.jwt.refresh-token.expiration=86400000

# Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=6000ms

# Geocoding API
geocoding.api.base-url=https://api.geoapify.com/v1/geocode/search?format=json
geocoding.api.key=${GEOCODING_API_KEY}

# Weather API
weather.api.base-url=https://api.openweathermap.org/data/2.5/weather?
weather.api.key=${WEATHER_API_KEY}

# Spotify API
spotify.api.token.base-url=https://accounts.spotify.com/api/token
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
redirect.uri=${REDIRECT_URI}
spotify.scope=playlist-modify-public
spotify.auth.uri=https://accounts.spotify.com/authorize

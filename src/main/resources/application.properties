# Spring Datasource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/skysong
spring.datasource.username=User
spring.datasource.password=${MYSQL_PASSWORD}

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Spring Main
spring.main.banner-mode=off

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security - JWT
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=600000
application.security.jwt.refresh-token.expiration=86400000

# Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD}
spring.redis.timeout=6000ms

# Geocoding API key
GEOCODING_AI_KEY=${GEOCODING_API_KEY}

# Weather API key
WEATHER_API_KEY=${WEATHER_API_KEY}

# Spotify Configuration
SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
REDIRECT_URI=${REDIRECT_URI}
SPOTIFY_SCOPE=playlist-modify-public
SPOTIFY_AUTH_URI=https://accounts.spotify.com/authorize
